worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;

  # Allow up to 50 MB uploads + overhead
  client_max_body_size 55m;

  server {
    listen 80;

    # API — proxy to Node backend
    location /api/ {
      # Re-resolve the backend container's IP via Docker's embedded DNS so a
      # recreated backend (new IP after `up --build`) is picked up without an
      # nginx restart. valid=30s caps re-resolution to once per 30s; in between
      # the cached IP is reused (no per-request lookup). Using a variable in
      # proxy_pass is what defers resolution to request time.
      resolver           127.0.0.11 valid=30s ipv6=off;
      set                $backend "backend";
      proxy_pass         http://$backend:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      # Allow large uploads to pass through
      client_max_body_size 55m;
    }

    # Everything else — Vite dev server (development)
    location / {
      # Same re-resolve treatment as /api/ — the frontend dev-server container
      # is recreated on every `up --build` too.
      resolver           127.0.0.11 valid=30s ipv6=off;
      set                $frontend "frontend";
      proxy_pass         http://$frontend:5173;
      proxy_http_version 1.1;
      # Required for Vite HMR websocket
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }
  }
}
